<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey | 平行现实决策模拟器</title>
  <link rel="icon" href="./assets/logo-mark.png" type="image/png" />
  <link rel="apple-touch-icon" href="./assets/logo-mark.png" />
  <script src="./config.js"></script>
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('prds_prefs') || '{}');
        if (prefs.theme === 'dark') {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
        document.documentElement.lang = prefs.locale === 'en' ? 'en' : 'zh-CN';
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="./css/tailwind.css?v=20260826e" />
  <link rel="stylesheet" href="./css/theme.css?v=20261023-kb-progress" />
</head>
<body class="bg-background text-on-surface font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="./js/app.js?v=20261023-kb-progress"></script>
</body>
</html>
