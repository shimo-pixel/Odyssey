# DTS LightRAG — 当前定制版（workspace / SQLite·CSV 导入 / 联邦查询）
#
# 构建镜像:
#   cd LightRAG
#   sudo ./scripts/build-dts-lightrag.sh
#   # 或:
#   docker compose build
#
# 启动:
#   docker compose up -d
#
# WebUI:  http://localhost:9621/webui
# API:    http://localhost:9621/docs
# Health: http://localhost:9621/health
#
# 说明:
#   - 使用 Dockerfile.dts（国内镜像源）构建 dts-lightrag:latest
#   - 挂载本目录 .env 作为运行时配置（LLM / Embedding 等）
#   - rag_storage / inputs / prompts 持久化到宿主机
#   - 本文件已包含 milvus / etcd / minio（以及可选 postgres）
#   - 容器内不能用 localhost:19530；compose 覆盖 MILVUS_URI=http://milvus:19530
#   - 宿主机直接跑 lightrag-server 时，.env 里仍用 MILVUS_URI=http://localhost:19530
#   - .env 需有 MINIO_ACCESS_KEY_ID / MINIO_SECRET_ACCESS_KEY（milvus-minio 用）

services:
  lightrag:
    image: dts-lightrag:latest
    container_name: dts-lightrag
    build:
      context: .
      dockerfile: Dockerfile.dts
      args:
        DOCKER_MIRROR: ${DOCKER_MIRROR:-docker.m.daocloud.io}
        GHCR_MIRROR: ${GHCR_MIRROR:-ghcr.nju.edu.cn}
        DEBIAN_MIRROR: ${DEBIAN_MIRROR:-mirrors.aliyun.com}
        PYPI_INDEX: ${PYPI_INDEX:-https://pypi.tuna.tsinghua.edu.cn/simple}
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmmirror.com}
        RUSTUP_DIST_SERVER: ${RUSTUP_DIST_SERVER:-https://rsproxy.cn}
        RUSTUP_UPDATE_ROOT: ${RUSTUP_UPDATE_ROOT:-https://rsproxy.cn/rustup}
    ports:
      - "${HOST:-0.0.0.0}:${PORT:-9621}:9621"
    volumes:
      - ./rag_storage:/app/data/rag_storage
      - ./inputs:/app/data/inputs
      - ./prompts:/app/data/prompts
      - ./.env:/app/.env:ro
    extra_hosts:
      # 容器内访问宿主机上的 Ollama / 本地网关等
      - "host.docker.internal:host-gateway"
    environment:
      LIGHTRAG_RUNTIME_TARGET: compose
      HOST: "0.0.0.0"
      PORT: "9621"
      WORKING_DIR: "/app/data/rag_storage"
      INPUT_DIR: "/app/data/inputs"
      PROMPT_DIR: "/app/data/prompts"
      TIKTOKEN_CACHE_DIR: "/app/data/tiktoken"
      # .env 里的 localhost 在容器内无效；同 compose 网络用服务名 milvus
      # （OS 环境变量优先于 .env，因 load_dotenv(override=False)）
      MILVUS_URI: "http://milvus:19530"
    depends_on:
      milvus:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:9621/health', timeout=5)",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  postgres:
    # this image does not support PGGraphStorage
    image: pgvector/pgvector:pg18
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - 'PORT_HEX="$(printf ''%04X'' 5432)"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ":$${PORT_HEX} "'
      interval: 5s
      timeout: 3s
      retries: 120
      start_period: 10s
    restart: unless-stopped
    environment:
      POSTGRES_USER: "rag"
      POSTGRES_PASSWORD: "rag"
      POSTGRES_DB: "rag"

  milvus:
    image: milvusdb/milvus:v2.6.11
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: milvus-etcd:2379
      MINIO_ADDRESS: milvus-minio:9000
      MINIO_ACCESS_KEY_ID: minioadmin
      MINIO_SECRET_ACCESS_KEY: minioadmin
    ports:
      - "19530:19530"
      - "9091:9091"
    volumes:
      - milvus_data:/var/lib/milvus
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           capabilities: ["gpu"]
    healthcheck:
      test:
        - CMD-SHELL
        - 'PORT_HEX="$(printf ''%04X'' 19530)"; cat /proc/net/tcp /proc/net/tcp6 2>/dev/null | grep -q ":$${PORT_HEX} "'
      interval: 10s
      timeout: 3s
      retries: 120
      start_period: 10s
    depends_on:
      milvus-etcd:
        condition: service_healthy
      milvus-minio:
        condition: service_healthy
    restart: unless-stopped

  milvus-etcd:
    image: quay.io/coreos/etcd:v3.5.25
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    volumes:
      - milvus-etcd_data:/etcd
    command: >
      etcd
      -advertise-client-urls=http://0.0.0.0:2379
      -listen-client-urls=http://0.0.0.0:2379
      -data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 20s
      timeout: 20s
      retries: 3
    restart: unless-stopped

  milvus-minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    environment:
      MINIO_ROOT_USER: "${MINIO_ACCESS_KEY_ID:?missing}"
      MINIO_ROOT_PASSWORD: "${MINIO_SECRET_ACCESS_KEY:?missing}"
    volumes:
      - milvus-minio_data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 20s
      retries: 3
    restart: unless-stopped

volumes:
  postgres_data:
  milvus_data:
  milvus-etcd_data:
  milvus-minio_data: