<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey | 平行现实决策模拟器</title>
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('prds_prefs') || '{}');
        if (prefs.theme === 'dark') {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
        document.documentElement.lang = prefs.locale === 'en' ? 'en' : 'zh-CN';
      } catch (_) {}
    })();
  </script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/style.min.css" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-mono/style.min.css" />
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link rel="stylesheet" href="/static/css/theme.css?v=20260612a" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: 'var(--accent)',
            'on-primary': 'var(--accent-fg)',
            'primary-fixed': 'var(--accent-muted)',
            'primary-fixed-dim': 'var(--accent-muted)',
            'primary-container': 'var(--accent)',
            secondary: 'var(--success)',
            'secondary-container': 'var(--success-muted)',
            'on-secondary-container': 'var(--success)',
            tertiary: 'var(--warning)',
            'tertiary-fixed': 'var(--warning-muted)',
            error: 'var(--danger)',
            background: 'var(--bg)',
            surface: 'var(--surface)',
            'surface-bright': 'var(--surface-elevated)',
            'surface-container': 'var(--surface-muted)',
            'surface-container-low': 'var(--bg)',
            'surface-container-lowest': 'var(--surface)',
            'surface-container-high': 'var(--surface-muted)',
            'surface-container-highest': 'var(--border-strong)',
            'surface-variant': 'var(--surface-muted)',
            'on-surface': 'var(--text)',
            'on-surface-variant': 'var(--text-muted)',
            'on-background': 'var(--text)',
            outline: 'var(--text-subtle)',
            'outline-variant': 'var(--border)',
          },
          fontFamily: {
            sans: ['Geist Sans', 'SF Pro Display', 'system-ui', '-apple-system', 'sans-serif'],
            mono: ['Geist Mono', 'SF Mono', 'ui-monospace', 'monospace'],
          },
          borderRadius: {
            DEFAULT: '6px',
            lg: '8px',
            xl: '10px',
          },
          boxShadow: {
            card: 'var(--shadow-card)',
            sm: 'var(--shadow-sm)',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-background text-on-surface font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="/static/js/app.js?v=20260612a"></script>
</body>
</html>
