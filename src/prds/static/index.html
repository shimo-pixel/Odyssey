<!DOCTYPE html>
<html class="light" lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Odyssey | 平行现实决策模拟器</title>
  <script>
    (function () {
      try {
        var prefs = JSON.parse(localStorage.getItem('prds_prefs') || '{}');
        if (prefs.theme === 'dark') {
          document.documentElement.classList.remove('light');
          document.documentElement.classList.add('dark');
        }
        document.documentElement.lang = prefs.locale === 'en' ? 'en' : 'zh-CN';
      } catch (_) {}
    })();
  </script>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/static/css/theme.css?v=20260605c" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            primary: 'var(--g-blue)',
            'on-primary': '#ffffff',
            'primary-fixed': 'var(--g-blue-light)',
            'primary-fixed-dim': 'var(--g-blue-light)',
            'primary-container': 'var(--g-blue)',
            secondary: 'var(--g-green)',
            'secondary-container': 'var(--g-green-light)',
            'on-secondary-container': 'var(--g-green)',
            tertiary: 'var(--g-orange)',
            'tertiary-fixed': 'var(--g-orange-light)',
            error: 'var(--g-red)',
            background: 'var(--md-background)',
            surface: 'var(--md-surface)',
            'surface-bright': 'var(--md-surface-bright)',
            'surface-container': 'var(--md-surface-container)',
            'surface-container-low': 'var(--md-surface-container-low)',
            'surface-container-lowest': 'var(--md-surface-container-lowest)',
            'surface-container-high': 'var(--md-surface-container-high)',
            'surface-container-highest': 'var(--md-surface-container-highest)',
            'surface-variant': 'var(--md-surface-variant)',
            'on-surface': 'var(--md-on-surface)',
            'on-surface-variant': 'var(--md-on-surface-variant)',
            'on-background': 'var(--md-on-background)',
            outline: 'var(--md-outline)',
            'outline-variant': 'var(--md-outline-variant)',
          },
          fontFamily: {
            sans: ['Roboto', 'Google Sans', 'system-ui', 'sans-serif'],
            mono: ['Roboto Mono', 'monospace'],
          },
          borderRadius: {
            DEFAULT: '8px',
            lg: '12px',
            xl: '16px',
          },
          boxShadow: {
            card: 'var(--shadow-card)',
            sm: 'var(--shadow-sm)',
          },
        },
      },
    };
  </script>
</head>
<body class="bg-background text-on-surface font-sans antialiased">
  <div id="app"></div>
  <script type="module" src="/static/js/app.js?v=20260605a"></script>
</body>
</html>
